# The chart converts this GitHub HTTPS URL to an SSH URL.
repoURL: https://github.com/dnv-opensource/kubeit-flux-example.git
branch: main

fluxSshKeyVaultUrl: https://kubeit-dev-kv-sh-we.vault.azure.net/

pathTemplate: "{{ print `./gitops/` .prodOrNonprod `/` .namespace }}"
#pathTemplate: "{{ print .prodOrNonprod `/` .namespace }}"
#pathTemplate: "{{ print .prodOrNonprod `/regions/` .region `/` .namespace }}"

useServiceMeshChartHelmRepository: true
useImageAutomation: true

gitRepoNameTemplate: "{{ print `git-repository-` .tenantName }}"
kustomizationNameTemplate: "{{ print `flux-kustomization-` .tenantName }}"

fluxSshSecretNameTemplate: "flux-sshkeys" # secret name in the gitops repo, is this the name as in argoApps?

dev:
  environments:
  - namespace: tenant2-sops-staging
    shortRegion: eus2
    clusterColour: blue
    clusterSubdomain: dev002
    workloadIdentityClientId: 5512dad8-0704-439c-9f5b-78da63c15875
  - namespace: tenant2-flux
    shortRegion: eus2
